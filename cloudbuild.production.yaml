steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_HCAD_ENV=production
      - --build-arg
      - NEXT_PUBLIC_ENV=production
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}
      - --tag
      - me-central2-docker.pkg.dev/${PROJECT_ID}/lazem-dispatch/web:${SHORT_SHA}
      - --tag
      - me-central2-docker.pkg.dev/${PROJECT_ID}/lazem-dispatch/web:production-latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - me-central2-docker.pkg.dev/${PROJECT_ID}/lazem-dispatch/web:${SHORT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - lazem-dispatch
      - --project=${PROJECT_ID}
      - --region=me-central2
      - --image=me-central2-docker.pkg.dev/${PROJECT_ID}/lazem-dispatch/web:${SHORT_SHA}
      - --service-account=lazem-dispatch-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --quiet

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - me-central2-docker.pkg.dev/${PROJECT_ID}/lazem-dispatch/web:production-latest

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _APP_URL: https://hcad.lazem.sa
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_STORAGE_BUCKET: lazem-dispatch-sa
  _FIREBASE_MESSAGING_SENDER_ID: ""
  _FIREBASE_APP_ID: ""
  _FIREBASE_MEASUREMENT_ID: ""
